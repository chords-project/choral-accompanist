apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- temporal.yaml
- ../warehouse/database
- ../loadgenerator
patches:
- target:
    kind: Deployment
    name: loadgenerator
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/env/1/value\n  value:\
    \ temporal\n"
