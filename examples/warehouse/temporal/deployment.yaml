apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker-workflow
  labels:
    app: temporal-worker-workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker-workflow
  template:
    metadata:
      labels:
        app: temporal-worker-workflow
    spec:
      initContainers:
      - name: wait-for-temporal
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z temporal-frontend 7233 > /dev/null; do echo Waiting for Temporal.;
          sleep 2; done;
      containers:
      - name: temporal-worker-workflow
        image: warehouse-temporal
        envFrom:
        - configMapRef:
            name: temporal-runtime-settings
        env:
        - name: WORKER_TYPE
          value: workflow
        - name: TEMPORAL_ADDRESS
          value: temporal-frontend:7233
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker-warehouse
  labels:
    app: temporal-worker-warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker-warehouse
  template:
    metadata:
      labels:
        app: temporal-worker-warehouse
    spec:
      initContainers:
      - name: wait-for-temporal
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - until nc -z temporal-frontend 7233 > /dev/null; do echo Waiting for Temporal.;
          sleep 2; done;
      - name: check-warehouse-db-ready
        image: postgres:17.6
        command:
        - sh
        - -c
        - until pg_isready -h db-warehouse -p 5432; do echo waiting for database;
          sleep 2; done;
      containers:
      - name: temporal-worker-warehouse
        image: warehouse-temporal
        envFrom:
        - configMapRef:
            name: temporal-runtime-settings
        env:
        - name: WORKER_TYPE
          value: warehouse
        - name: TEMPORAL_ADDRESS
          value: temporal-frontend:7233
        - name: POSTGRES_URL
          value: postgresql://db-warehouse:5432/warehouse
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          periodSeconds: 2
---
