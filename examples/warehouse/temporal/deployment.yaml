---
apiVersion: v1
kind: Service
metadata:
  name: temporal-warehouse-endpoint
  labels:
    app: temporal-warehouse-endpoint
spec:
  ports:
    - port: 5001
      name: rest-port
  clusterIP: None
  selector:
    app: temporal-warehouse-endpoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-warehouse-endpoint
  labels:
    app: temporal-warehouse-endpoint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-warehouse-endpoint
  template:
    metadata:
      labels:
        app: temporal-warehouse-endpoint
    spec:
      initContainers:
        - name: wait-for-temporal-loyalty
          image: busybox
          command: [ "sh", "-c",
                     "until nc -z temporal 7233 > /dev/null; do echo Waiting for Temporal.; sleep 2; done;" ]
      containers:
        - name: temporal-warehouse-endpoint
          image: warehouse-temporal
          env:
            - name: WORKER_TYPE
              value: endpoint
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: LISTEN_PORT
              value: '5001'
