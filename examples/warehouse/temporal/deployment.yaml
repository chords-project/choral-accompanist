apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker-warehouse
  labels:
    app: temporal-worker-warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-worker-warehouse
  template:
    metadata:
      labels:
        app: temporal-worker-warehouse
    spec:
      initContainers:
        - name: wait-for-temporal-warehouse
          image: busybox
          command: [ "sh", "-c",
                     "until nc -z temporal 7233 > /dev/null; do echo Waiting for Temporal.; sleep 2; done;" ]
        - name: check-warehouse-db-ready
          image: postgres
          command: [
            'sh', '-c',
            'until pg_isready -h db-warehouse -p 5432; 
                    do echo waiting for database; sleep 2; done;'
          ]
      containers:
        - name: temporal-worker-warehouse
          image: warehouse-temporal
          env:
            - name: WORKER_TYPE
              value: warehouse
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: POSTGRES_URL
              value: "postgresql://db-warehouse:5432/warehouse"

