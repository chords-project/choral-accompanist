---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: postgresql
  name: postgresql
spec:
  ports:
    - name: "5432"
      port: 5432
      targetPort: 5432
  selector:
    io.kompose.service: postgresql

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: temporal
  name: temporal
spec:
  ports:
    - name: "7233"
      port: 7233
      targetPort: 7233
    - name: "7235"
      port: 7235
      targetPort: 7235
  selector:
    io.kompose.service: temporal

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: temporal-ui
  name: temporal-ui
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: temporal-ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: postgresql
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgresql
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: postgresql
    spec:
      containers:
        - env:
            - name: POSTGRES_PASSWORD
              value: temporal
            - name: POSTGRES_USER
              value: temporal
          image: postgres:17
          name: temporal-postgresql
          ports:
            - containerPort: 5432
              protocol: TCP
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: temporal
  name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: temporal
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: temporal
    spec:
      affinity: # Deploy on same node as temporal db service
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: io.kompose.service
                    operator: In
                    values:
                      - postgresql
      containers:
        - env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_PWD
              value: temporal
            - name: POSTGRES_SEEDS
              value: postgresql
            - name: POSTGRES_USER
              value: temporal
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_CLI_ADDRESS
              value: temporal:7233
          image: temporalio/auto-setup:1.28.0
          name: temporal
          ports:
            - containerPort: 7233
              protocol: TCP
            - containerPort: 7235
              protocol: TCP
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: temporal-admin-tools
  name: temporal-admin-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: temporal-admin-tools
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: temporal-admin-tools
    spec:
      affinity: # Deploy on same node as temporal db service
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: io.kompose.service
                    operator: In
                    values:
                      - postgresql
      containers:
        - env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_CLI_ADDRESS
              value: temporal:7233
          image: temporalio/admin-tools:1.28.0-tctl-1.18.2-cli-1.3.0
          name: temporal-admin-tools
          stdin: true
          tty: true
      restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: temporal-ui
  name: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: temporal-ui
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f temporal/compose.yml -o temporal/temporal.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: temporal-ui
    spec:
      affinity: # Deploy on same node as temporal db service
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: io.kompose.service
                    operator: In
                    values:
                      - postgresql
      containers:
        - env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_CORS_ORIGINS
              value: http://localhost:3000
            - name: TEMPORAL_UI_PORT
              value: "8080"
          image: temporalio/ui:2.38.3
          name: temporal-ui
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always

