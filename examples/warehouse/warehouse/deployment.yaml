apiVersion: v1
kind: Service
metadata:
  name: warehouse
  labels:
    app: warehouse
spec:
  ports:
  - name: choral
    port: 4001
    targetPort: 4001
    protocol: TCP
  - name: web-endpoint
    port: 5000
    protocol: TCP
  clusterIP: None
  selector:
    app: warehouse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  labels:
    app: warehouse
    group: warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warehouse
  template:
    metadata:
      labels:
        app: warehouse
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - db-warehouse
      initContainers:
      - name: check-warehouse-db-ready
        image: postgres:17.6
        command:
        - sh
        - -c
        - until pg_isready -h db-warehouse -p 5432; do echo waiting for database;
          sleep 2; done;
      containers:
      - name: warehouse-sidecar
        image: warehouse
        envFrom:
        - configMapRef:
            name: accompanist-runtime-settings
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Djava.security.properties=/etc/accompanist/warehouse-dns.security
        - name: RUN
          value: sidecar
        - name: WAREHOUSE
          value: warehouse:4001
        - name: PAYMENT
          value: payment:4002
        - name: LOYALTY
          value: loyalty:4003
        - name: POSTGRES_URL
          value: postgresql://db-warehouse:5432/warehouse
        - name: LISTEN_PORT
          value: '5000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://lgtm:4317
        - name: OTEL_METRIC_EXPORT_INTERVAL_SECONDS
          value: '1'
        - name: OTEL_SERVICE_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: warehouse-dns-settings
          mountPath: /etc/accompanist
          readOnly: true
        resources: &id001
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          tcpSocket:
            port: 5000
          periodSeconds: 2
      - name: warehouse-service
        image: warehouse
        envFrom:
        - configMapRef:
            name: accompanist-runtime-settings
        env:
        - name: RUN
          value: service
        - name: POSTGRES_URL
          value: postgresql://db-warehouse:5432/warehouse
        - name: LISTEN_PORT
          value: '5000'
        resources: *id001
      volumes:
      - name: warehouse-dns-settings
        configMap:
          name: warehouse-dns-settings
          items:
          - key: warehouse-dns.security
            path: warehouse-dns.security
