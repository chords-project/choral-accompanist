apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: warehouse
build:
  artifacts:
    - image: loyalty
      context: loyalty
      jib:
        project: loyalty
    - image: payment
      context: payment
      jib:
        project: payment
    - image: warehouse
      context: warehouse
      jib:
        project: warehouse
    - image: loadgenerator
      context: loadgenerator
    - image: warehouse-monitor
      context: monitor
manifests:
  rawYaml:
    - warehouse/deployment.yaml
    - loyalty/deployment.yaml
    - payment/deployment.yaml
    - loadgenerator/deployment.yaml
    - observability/deployment.yaml
    - monitor/deployment.yaml
portForward:
  - resourceType: service
    resourceName: warehouse
    port: 5000
  - resourceType: service
    resourceName: loadgenerator
    port: 8089
  - resourceType: service
    resourceName: lgtm
    port: 3000
    localPort: 3000
