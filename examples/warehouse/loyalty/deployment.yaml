apiVersion: v1
kind: Service
metadata:
  name: loyalty
  labels:
    app: loyalty
spec:
  ports:
    - port: 4003
      protocol: TCP
  clusterIP: None
  selector:
    app: loyalty
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty
  labels:
    app: loyalty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty
  template:
    metadata:
      labels:
        app: loyalty
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - db-loyalty
      initContainers:
        - name: check-loyalty-db-ready
          image: postgres:17.6
          command:
            - sh
            - -c
            - until pg_isready -h db-loyalty -p 5432; do echo waiting for database; sleep 2; done;
      containers:
        - name: loyalty-sidecar
          image: loyalty
          env:
            - name: RUN
              value: sidecar
            - name: WAREHOUSE
              value: warehouse:4001
            - name: PAYMENT
              value: payment:4002
            - name: LOYALTY
              value: loyalty:4003
            - name: POSTGRES_URL
              value: postgresql://db-loyalty:5432/loyalty
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4317
            - name: OTEL_METRIC_EXPORT_INTERVAL_SECONDS
              value: '1'
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources: &id001
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 4003
            periodSeconds: 2
        - name: loyalty-service
          image: loyalty
          env:
            - name: RUN
              value: service
            - name: POSTGRES_URL
              value: postgresql://db-loyalty:5432/loyalty
          resources: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: db-loyalty
  labels:
    app: db-loyalty
spec:
  ports:
    - port: 5432
      protocol: TCP
  clusterIP: None
  selector:
    app: db-loyalty
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-loyalty
  labels:
    app: db-loyalty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-loyalty
  template:
    metadata:
      labels:
        app: db-loyalty
    spec:
      containers:
        - name: db-loyalty
          image: postgres:17.6
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: loyalty
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres
            periodSeconds: 2
