apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app: payment
spec:
  ports:
    - port: 4003
      protocol: TCP
  clusterIP: None
  selector:
    app: payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      initContainers:
        - name: check-payment-db-ready
          image: postgres
          command: [
            'sh', '-c',
            'until pg_isready -h db-payment -p 5432; 
                    do echo waiting for database; sleep 2; done;'
          ]
      containers:
        - name: payment-sidecar
          image: payment
          env:
            - name: RUN
              value: 'sidecar'
            - name: WAREHOUSE
              value: warehouse:4001
            - name: PAYMENT
              value: payment:4002
            - name: LOYALTY
              value: loyalty:4003
            - name: POSTGRES_URL
              value: "postgresql://db-payment:5432/payment"
        - name: payment-service
          image: payment
          env:
            - name: RUN
              value: 'service'
---
apiVersion: v1
kind: Service
metadata:
  name: db-payment
  labels:
    app: db-payment
spec:
  ports:
    - port: 5432
      protocol: TCP
  clusterIP: None
  selector:
    app: db-payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-payment
  labels:
    app: db-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-payment
  template:
    metadata:
      labels:
        app: db-payment
    spec:
      containers:
        - name: db-payment
          image: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: payment
