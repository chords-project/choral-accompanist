services:
  warehouse-sidecar:
    image: accompanist-warehouse
    depends_on:
      - db-warehouse
      - lgtm
    environment:
      RUN: "sidecar"
      WAREHOUSE: warehouse-sidecar:4001
      PAYMENT: payment-sidecar:4002
      LOYALTY: loyalty-sidecar:4003
      POSTGRES_URL: "postgresql://db-warehouse:5432/warehouse"
      LISTEN_PORT: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: 1
    ports:
      - "5000:5000"
  payment-sidecar:
    image: accompanist-payment
    depends_on:
      - db-payment
      - lgtm
    environment:
      RUN: "sidecar"
      WAREHOUSE: warehouse-sidecar:4001
      PAYMENT: payment-sidecar:4002
      LOYALTY: loyalty-sidecar:4003
      POSTGRES_URL: "postgresql://db-payment:5432/payment"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: 1
  loyalty-sidecar:
    image: accompanist-loyalty
    depends_on:
      - db-loyalty
      - lgtm
    environment:
      RUN: "sidecar"
      WAREHOUSE: warehouse-sidecar:4001
      PAYMENT: payment-sidecar:4002
      LOYALTY: loyalty-sidecar:4003
      POSTGRES_URL: "postgresql://db-loyalty:5432/loyalty"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: 1

  lgtm:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD", "cat", "/tmp/ready"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 10s

  db-warehouse:
    image: postgres
    expose:
      - 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
  db-payment:
    image: postgres
    expose:
      - 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
  db-loyalty:
    image: postgres
    expose:
      - 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loyalty

volumes:
  lgtm-data:
