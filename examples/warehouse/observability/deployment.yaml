apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  type: ClusterIP
  selector:
    app: lgtm
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: grafana
      port: 3000
      targetPort: grafana
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.32.1
          env:
            - name: GF_USERS_DEFAULT_THEME
              value: system
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: accompanist-dashboard-provisioning
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/accompanist.yaml
              subPath: accompanist.yaml
              readOnly: true
            - name: accompanist-dashboards
              mountPath: /otel-lgtm/accompanist-dashboards
              readOnly: true
            - name: grafana-data
              mountPath: /data/grafana
            - name: prometheus-data
              mountPath: /data/prometheus
            - name: tempo-data
              mountPath: /data/tempo
            - name: loki-data
              mountPath: /data/loki
            - name: pyroscope-data
              mountPath: /data/pyroscope
      volumes:
        - name: accompanist-dashboard-provisioning
          configMap:
            name: grafana-accompanist-provisioning
        - name: accompanist-dashboards
          configMap:
            name: grafana-accompanist-dashboards
        - name: grafana-data
          emptyDir: {}
        - name: prometheus-data
          emptyDir: {}
        - name: tempo-data
          emptyDir: {}
        - name: loki-data
          emptyDir: {}
        - name: pyroscope-data
          emptyDir: {}
