syntax = "proto3";

import "google/protobuf/empty.proto";

package choral_reactive;

service Channel {
  rpc SendMessage (Message) returns (google.protobuf.Empty);
  rpc NotifyReady (ReadyNotification) returns (google.protobuf.Empty);
}

service StreamingChannel {
    rpc StreamMessages(stream Message) returns (google.protobuf.Empty);
}

message Message {
  string choreography = 1;
  string sender = 2;
  int32 sequence_number = 3;
  int32 session_id = 4;
  bytes payload = 5;
  map<string, string> headers = 6;
  SpanContext span_context = 7;
  string benchmark_run_id = 8;
}

message ReadyNotification {
  string service_name = 1;
  string address = 2;
}

message SpanContext {
  string trace_id_hex = 1;
  string span_id_hex = 2;
  bytes trace_flags = 3;
  map<string, string> trace_state = 4;
}
